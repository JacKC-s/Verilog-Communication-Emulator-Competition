# Tiny Tapeout project information
project:
  title:        "Protocol Emulator"   # Project title
  author:       "JacKC-s"             # Your name
  discord:      ""                    # Your discord username (optional)
  description:  "A reprogrammable protocol emulator: a tiny CPU that bit-bangs UART, SPI and I2C from firmware."
  language:     "Verilog"
  clock_hz:     50000000              # 50 MHz

  # How many tiles your design occupies? A single tile is about 202x155 uM.
  # The Jane Street competition allows up to 8x4; the template asks for 8x4.
  tiles: "8x4"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_jackc_protocol_emulator"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "execution_controller.v"
    - "instruction_decoder.v"
    - "instruction_mem.v"
    - "program_counter.v"
    - "synchronous_fifo.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "GPIO_IN"
  ui[1]: "RUN"
  ui[2]: "LOAD_EN"
  ui[3]: "LOAD_BYTE_SEL"
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "PIN0"
  uo[1]: "PC0"
  uo[2]: "PC1"
  uo[3]: "PC2"
  uo[4]: "PC3"
  uo[5]: "PC4"
  uo[6]: "PC5"
  uo[7]: "PC6"

  # Bidirectional pins
  uio[0]: "HOST_DATA0"
  uio[1]: "HOST_DATA1"
  uio[2]: "HOST_DATA2"
  uio[3]: "HOST_DATA3"
  uio[4]: "HOST_DATA4"
  uio[5]: "HOST_DATA5"
  uio[6]: "HOST_DATA6"
  uio[7]: "HOST_DATA7"

# Do not change!
yaml_version: 6
